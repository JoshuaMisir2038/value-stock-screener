name: Keep Workflows Alive

# GitHub automatically disables scheduled workflows after 60 days of no human
# push activity. This job runs on the 1st of every month and re-enables the
# update_data workflow, resetting GitHub's inactivity counter.

on:
  schedule:
    - cron: '0 12 1 * *'   # 1st of every month at noon UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-enable update_data workflow
        run: gh workflow enable update_data.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Touch keepalive file to register human-equivalent activity
        run: |
          mkdir -p .github
          echo "$(date -u '+%Y-%m-%dT%H:%M:%S UTC')" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --cached --quiet || git commit -m "chore: keepalive $(date -u '+%Y-%m')"
          git push origin main
