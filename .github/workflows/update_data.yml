name: Update Stock Data

on:
  schedule:
    # 9:30am ET (market open) = 1:30pm UTC  — weekdays
    - cron: '30 13 * * 1-5'
    # 4:30pm ET (market close) = 8:30pm UTC — weekdays
    - cron: '30 20 * * 1-5'
    # Saturday noon UTC — weekend keepalive (stamps last_run.json so GitHub
    # counts repo activity and doesn't disable scheduled workflows)
    - cron: '0 12 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install "yfinance==0.2.54" "pandas>=2.0" requests lxml urllib3

      - name: Fetch stock data
        run: python scripts/fetch_data.py
        continue-on-error: true

      - name: Fetch bond and commodity data
        run: python scripts/fetch_market_data.py
        continue-on-error: true

      - name: Fetch macro data (VIX, PCR, FRED)
        run: python scripts/fetch_macro.py
        continue-on-error: true

      - name: Run options backtest
        run: python scripts/run_backtest.py
        continue-on-error: true

      - name: Snapshot value scores (once per day)
        run: python scripts/snapshot_scores.py
        continue-on-error: true

      - name: Check and send price alerts
        run: python scripts/check_alerts.py
        continue-on-error: true
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL:                ${{ secrets.FROM_EMAIL }}

      # Always stamp the run time so there is always something to commit.
      # This keeps the workflow "active" in GitHub's eyes and is easy to
      # audit in git log.
      - name: Stamp run time
        if: always()
        run: |
          mkdir -p public/data
          echo "{\"lastRun\": \"$(date -u '+%Y-%m-%dT%H:%M:%S UTC')\"}" > public/data/last_run.json

      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "chore: update market data $(date -u '+%Y-%m-%dT%H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed, retrying in 15s..."
            sleep 15
          done

      # Re-enable this very workflow each run so GitHub never auto-disables it.
      - name: Re-enable scheduled workflow (prevent auto-disable)
        if: always()
        run: gh workflow enable update_data.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub blocks deploy.yml from auto-triggering on bot pushes (GITHUB_TOKEN
      # restriction). Explicitly dispatch it here so the site always rebuilds with
      # fresh data after every successful data update.
      - name: Trigger site redeploy with fresh data
        if: always()
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
