name: Update Stock Data

on:
  schedule:
    # 9:30am ET (market open) = 1:30pm UTC  — weekdays
    - cron: '30 13 * * 1-5'
    # 4:30pm ET (market close) = 8:30pm UTC — weekdays
    - cron: '30 20 * * 1-5'
    # Saturday noon UTC — weekend keepalive (stamps last_run.json so GitHub
    # counts repo activity and doesn't disable scheduled workflows)
    - cron: '0 12 * * 6'
  workflow_dispatch:
    inputs:
      ticker_limit:
        description: 'Cap the ticker universe to the top N (S&P 500 first) for a fast/emergency run. Leave blank for full universe.'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install "yfinance>=1.6.0" "curl_cffi>=0.7" "pandas>=2.0" requests lxml urllib3

      - name: Fetch stock data (Finnhub)
        run: python scripts/fetch_data.py
        continue-on-error: true
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TICKER_LIMIT: ${{ inputs.ticker_limit }}

      # fetch_data.py silently keeps the existing stocks.json (and exits 0) when
      # the Finnhub pre-flight check fails, so the step above shows green even
      # when nothing was actually refreshed. Check the timestamp it just wrote
      # to catch that case and fail the job loudly instead.
      - name: Verify core stock data actually refreshed
        run: |
          python3 - <<'EOF'
          import json, sys
          from datetime import datetime, timezone

          with open('public/data/stocks.json') as f:
              data = json.load(f)

          last_updated = datetime.fromisoformat(data['lastUpdated'])
          age_minutes = (datetime.now(timezone.utc) - last_updated).total_seconds() / 60

          if age_minutes > 15:
              print(f"::error::stocks.json was NOT refreshed this run (lastUpdated is {age_minutes:.0f} min old). "
                    f"Finnhub pre-flight likely failed — check FINNHUB_API_KEY validity/quota.")
              sys.exit(1)
          print(f"stocks.json refreshed {age_minutes:.1f} min ago — OK")
          EOF

      - name: Fetch international stocks (FTSE 100, DAX, CAC, Nikkei, Hang Seng, ASX, TSX, BSE)
        if: always()
        run: python scripts/fetch_international.py
        continue-on-error: true

      - name: Fetch bond and commodity data
        if: always()
        run: python scripts/fetch_market_data.py
        continue-on-error: true

      - name: Fetch macro data (VIX, PCR, FRED)
        if: always()
        run: python scripts/fetch_macro.py
        continue-on-error: true

      - name: Run options backtest
        if: always()
        run: python scripts/run_backtest.py
        continue-on-error: true

      - name: Snapshot value scores (once per day)
        if: always()
        run: python scripts/snapshot_scores.py
        continue-on-error: true

      - name: Check and send price alerts
        if: always()
        run: python scripts/check_alerts.py
        continue-on-error: true
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL:                ${{ secrets.FROM_EMAIL }}

      # Always stamp the run time so there is always something to commit.
      # This keeps the workflow "active" in GitHub's eyes and is easy to
      # audit in git log.
      - name: Stamp run time
        if: always()
        run: |
          mkdir -p public/data
          echo "{\"lastRun\": \"$(date -u '+%Y-%m-%dT%H:%M:%S UTC')\"}" > public/data/last_run.json

      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "chore: update market data $(date -u '+%Y-%m-%dT%H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed, retrying in 15s..."
            sleep 15
          done

      # Re-enable this very workflow each run so GitHub never auto-disables it.
      - name: Re-enable scheduled workflow (prevent auto-disable)
        if: always()
        run: gh workflow enable update_data.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub blocks deploy.yml from auto-triggering on bot pushes (GITHUB_TOKEN
      # restriction). Explicitly dispatch it here so the site always rebuilds with
      # fresh data after every successful data update.
      - name: Trigger site redeploy with fresh data
        if: always()
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
